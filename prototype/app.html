<!DOCTYPE html>
<!-- Phase 4b fixes: origin-checked postMessage; CSS.escape lobe selectors; bridge Go to. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Lung Navigator</title>
  <style>
    :root {
      --ground: #EDF1F3;
      --surface: #FFFFFF;
      --edge: #C7D3DA;
      --ink: #17242B;
      --muted: #5D7280;
      --steel: #2E6E88;
      --mucosa: #B4522F;
      --warn: #8A5A00;
      --warn-bg: #F5E6C8;
      --ok: #2F6B4F;
      --sans: ui-sans-serif, system-ui, "Segoe UI", Helvetica, Arial, sans-serif;
      --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      --cond: ui-sans-serif, system-ui, "Segoe UI", Helvetica, Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: var(--ground);
      color: var(--ink);
      font: 400 14px/1.45 var(--sans);
      display: grid;
      grid-template-rows: auto auto auto auto 1fr;
      height: 100dvh;
    }
    header {
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
      padding: 12px 18px; background: var(--surface); border-bottom: 1px solid var(--edge);
    }
    .brand {
      font-family: var(--cond);
      font-weight: 600; font-size: 18px;
    }
    .brand span {
      display: block; font-size: 10px; letter-spacing: .14em; text-transform: uppercase;
      color: var(--mucosa); font-weight: 500; margin-bottom: 2px;
    }
    .clinician { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .clinician .who {
      font-family: var(--mono); font-size: 12.5px;
    }
    .clinician form { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    input, select, button {
      font: inherit; border: 1px solid var(--edge); background: var(--surface);
      color: var(--ink); border-radius: 4px; padding: 6px 10px;
    }
    button {
      background: var(--steel); color: #fff; border-color: var(--steel); cursor: pointer;
    }
    button.secondary { background: transparent; color: var(--steel); }
    button:disabled { opacity: .45; cursor: not-allowed; }
    .bar {
      display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
      padding: 10px 18px; border-bottom: 1px solid var(--edge); background: color-mix(in srgb, var(--surface) 92%, transparent);
    }
    .bar label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; }
    .workflow {
      display: flex; gap: 6px; flex-wrap: wrap; padding: 8px 18px;
      border-bottom: 1px solid var(--edge); background: var(--surface);
    }
    .workflow .step {
      font: 500 11px/1.2 var(--mono); padding: 6px 8px; border-radius: 4px;
      border: 1px solid var(--edge); color: var(--muted); max-width: 11rem;
    }
    .workflow .step.done { background: color-mix(in srgb, var(--ok) 18%, white); color: var(--ok); border-color: color-mix(in srgb, var(--ok) 40%, white); }
    .workflow .step.available { background: color-mix(in srgb, var(--steel) 14%, white); color: var(--steel); border-color: color-mix(in srgb, var(--steel) 35%, white); }
    .workflow .step.blocked { opacity: .55; }
    .workflow .step .n { display: block; font-size: 9px; letter-spacing: .08em; text-transform: uppercase; margin-bottom: 2px; }
    .panel {
      display: none; padding: 12px 18px; border-bottom: 1px solid var(--edge);
      background: var(--surface);
    }
    .panel.visible { display: block; }
    .panel h2 { margin: 0 0 8px; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
    .panel .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 8px; }
    .panel input[type="text"] { min-width: min(28rem, 100%); flex: 1; }
    .series-table { width: 100%; border-collapse: collapse; font-size: 12px; }
    .series-table th, .series-table td { border-bottom: 1px solid var(--edge); padding: 6px 8px; text-align: left; }
    .series-table tr.proposed { background: color-mix(in srgb, var(--steel) 12%, white); }
    .series-table .skip { color: var(--muted); }
    .job-log {
      font: 12px/1.35 var(--mono); background: #0f1619; color: #d7e0e5;
      padding: 8px 10px; border-radius: 4px; max-height: 10rem; overflow: auto; white-space: pre-wrap;
    }
    .gate {
      margin: 0 18px; padding: 12px 14px; background: var(--warn-bg); color: var(--warn);
      border: 1px solid color-mix(in srgb, var(--warn) 35%, white); border-radius: 4px;
      display: none;
    }
    .gate.visible { display: block; }
    .gate a { color: var(--mucosa); }
    .stage { min-height: 0; }
    .stage iframe { width: 100%; height: 100%; border: 0; background: var(--ground); }
    .empty { padding: 40px 18px; color: var(--muted); }
    .msg { color: var(--mucosa); font-size: 13px; margin: 6px 0; }
  </style>
</head>
<body>
  <header>
    <div class="brand"><span>Local</span>Lung Navigator</div>
    <div class="clinician" id="clinician"></div>
  </header>
  <div class="bar">
    <label for="case-select">Case</label>
    <select id="case-select"><option value="">Loading…</option></select>
    <button type="button" id="open-case">Open</button>
    <button type="button" class="secondary" id="toggle-import">Import CT</button>
    <button type="button" id="segment-btn" disabled>Segment</button>
    <button type="button" class="secondary" id="confirm-route-start-btn" disabled>Confirm RouteStart</button>
    <button type="button" class="secondary" id="move-route-start-btn" disabled hidden>Move RouteStart</button>
    <button type="button" class="secondary" id="toggle-review">Review</button>
    <span id="job-status" class="msg"></span>
  </div>
  <div class="workflow" id="workflow" aria-label="Workflow steps"></div>
  <div class="panel" id="review-panel">
    <h2>Review and correct</h2>
    <div class="msg" id="review-msg"></div>
    <div class="row"><strong>Bridges</strong></div>
    <div id="review-bridges"></div>
    <div class="row" style="margin-top:10px"><strong>Review flags</strong></div>
    <div id="review-flags"></div>
    <div class="row" style="margin-top:10px"><strong>Corrections</strong></div>
    <div id="review-corrections"></div>
  </div>
  <div class="panel" id="import-panel">
    <h2>Import CT</h2>
    <div class="row">
      <input type="text" id="import-src" placeholder="~/Downloads/dicom" value="">
      <button type="button" id="import-scan">Scan</button>
      <button type="button" id="import-confirm" disabled>Confirm</button>
      <button type="button" class="secondary" id="confirm-existing-series" disabled hidden>Confirm series for this case</button>
    </div>
    <div class="row">
      <label for="import-series">Override series</label>
      <select id="import-series"><option value="">Proposed</option></select>
    </div>
    <div class="msg" id="import-msg"></div>
    <div id="import-table-wrap"></div>
  </div>
  <div class="panel" id="job-panel">
    <h2>Segmentation job</h2>
    <div class="msg" id="job-elapsed"></div>
    <div class="job-log" id="job-log"></div>
  </div>
  <div class="gate" id="gate" role="alert"></div>
  <div class="stage" id="stage">
    <div class="empty">Select a case to open the renderer.</div>
  </div>
  <script>
  "use strict";
  const clinicianEl = document.getElementById("clinician");
  const selectEl = document.getElementById("case-select");
  const gateEl = document.getElementById("gate");
  const stageEl = document.getElementById("stage");
  const workflowEl = document.getElementById("workflow");
  const importPanel = document.getElementById("import-panel");
  const reviewPanel = document.getElementById("review-panel");
  const jobPanel = document.getElementById("job-panel");
  const importMsg = document.getElementById("import-msg");
  const reviewMsg = document.getElementById("review-msg");
  const importSeries = document.getElementById("import-series");
  const jobStatus = document.getElementById("job-status");
  const jobLog = document.getElementById("job-log");
  const jobElapsed = document.getElementById("job-elapsed");
  const segmentBtn = document.getElementById("segment-btn");
  const routeStartBtn = document.getElementById("confirm-route-start-btn");
  let cases = [];
  let currentCase = null;
  let scanResult = null;
  let jobPoll = null;
  let jobPollCase = null;
  let workflowBody = null;
  let routeStartMoving = false;
  let routeStartConfirmedNode = null;
  let routeStartSelectedNode = null;
  let reviewBody = null;

  function clearEl(el) {
    while (el.firstChild) el.removeChild(el.firstChild);
  }

  function el(tag, attrs, text) {
    const node = document.createElement(tag);
    if (attrs) {
      for (const [key, value] of Object.entries(attrs)) {
        if (key === "className") node.className = value;
        else node.setAttribute(key, value);
      }
    }
    if (text != null) node.textContent = text;
    return node;
  }

  function renderClinician(data) {
    clearEl(clinicianEl);
    if (data && data.role && data.initials) {
      clinicianEl.appendChild(el("span", { className: "who" }, `${data.role}, ${data.initials}`));
      const change = el("button", { type: "button", className: "secondary", id: "change-clinician" }, "Change clinician");
      change.onclick = () => renderClinicianForm();
      clinicianEl.appendChild(change);
      return;
    }
    renderClinicianForm();
  }

  function renderClinicianForm() {
    clearEl(clinicianEl);
    const form = el("form", { id: "clinician-form" });
    const role = el("input", { name: "role", placeholder: "Role", required: "required", autocomplete: "off" });
    const initials = el("input", {
      name: "initials", placeholder: "A.B.", required: "required",
      pattern: "([A-Z]\\.){1,4}", autocomplete: "off",
    });
    form.appendChild(role);
    form.appendChild(initials);
    form.appendChild(el("button", { type: "submit" }, "Save"));
    form.onsubmit = async (event) => {
      event.preventDefault();
      const fd = new FormData(event.target);
      const body = { role: String(fd.get("role") || "").trim(), initials: String(fd.get("initials") || "").trim() };
      const res = await fetch("/api/clinician", {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      if (!res.ok) {
        const detail = await res.json().catch(() => ({}));
        alert(detail.detail || "Could not save clinician");
        return;
      }
      renderClinician(await res.json());
    };
    clinicianEl.appendChild(form);
  }

  function caseLabel(item) {
    const review = item.review && item.review.unresolved
      ? ` · ${item.review.unresolved} unresolved`
      : "";
    const graph = item.has_graph ? "" : " · no graph";
    const ver = item.version != null ? ` · v${item.version}` : "";
    return `${item.id} (${item.source})${ver}${review}${graph}`;
  }

  async function loadCases() {
    const res = await fetch("/api/cases");
    cases = await res.json();
    clearEl(selectEl);
    if (!cases.length) {
      selectEl.appendChild(el("option", { value: "" }, "No cases"));
      return;
    }
    for (const item of cases) {
      selectEl.appendChild(el("option", { value: item.id }, caseLabel(item)));
    }
    const params = new URLSearchParams(location.search);
    const wanted = params.get("case");
    if (wanted && cases.some(c => c.id === wanted)) {
      selectEl.value = wanted;
      openCase(wanted, params.get("allow_review") === "1");
    }
  }

  function stopJobPoll() {
    if (jobPoll) {
      clearInterval(jobPoll);
      jobPoll = null;
    }
    jobPollCase = null;
  }

  function renderWorkflow(body) {
    workflowBody = body;
    clearEl(workflowEl);
    if (!body || !body.steps) return;
    for (const step of body.steps) {
      const node = el("div", {
        className: `step ${step.status}`,
        title: step.reason || step.name,
      });
      node.appendChild(el("span", { className: "n" }, `Step ${step.step} · ${step.status}`));
      node.appendChild(document.createTextNode(step.name));
      workflowEl.appendChild(node);
    }
    const s1 = body.steps.find(s => s.step === 1);
    const s3 = body.steps.find(s => s.step === 3);
    const s5 = body.steps.find(s => s.step === 5);
    const canSegment = s3 && (s3.status === "available" || s3.status === "done");
    segmentBtn.disabled = !canSegment;
    segmentBtn.textContent = (s3 && s3.status === "done") ? "Re-run segmentation" : "Segment";

    const confirmExisting = document.getElementById("confirm-existing-series");
    const showConfirmSeries = !!(currentCase && s1 && s1.status === "available"
      && String(currentCase).startsWith("local-"));
    confirmExisting.hidden = !showConfirmSeries;
    confirmExisting.disabled = !showConfirmSeries;

    syncRouteStartButtons(s5);
  }

  function syncRouteStartButtons(s5) {
    const moveBtn = document.getElementById("move-route-start-btn");
    if (!s5 || (s5.status !== "available" && s5.status !== "done")) {
      routeStartBtn.disabled = true;
      moveBtn.hidden = true;
      moveBtn.disabled = true;
      return;
    }
    const done = s5.status === "done";
    moveBtn.hidden = !done;
    moveBtn.disabled = !done;
    if (done && !routeStartMoving) {
      const changed = routeStartSelectedNode != null
        && routeStartConfirmedNode != null
        && Number(routeStartSelectedNode) !== Number(routeStartConfirmedNode);
      routeStartBtn.disabled = !changed;
      routeStartBtn.textContent = changed ? "Confirm new RouteStart" : "Confirm RouteStart";
    } else {
      routeStartBtn.disabled = false;
      routeStartBtn.textContent = routeStartMoving ? "Confirm new RouteStart" : "Confirm RouteStart";
    }
  }

  async function loadWorkflow(caseId) {
    if (!caseId) {
      clearEl(workflowEl);
      segmentBtn.disabled = true;
      routeStartBtn.disabled = true;
      document.getElementById("move-route-start-btn").hidden = true;
      document.getElementById("confirm-existing-series").hidden = true;
      return;
    }
    const res = await fetch(`/api/cases/${encodeURIComponent(caseId)}/workflow`);
    if (!res.ok) {
      clearEl(workflowEl);
      return;
    }
    renderWorkflow(await res.json());
  }

  function showGate(caseId, unresolved) {
    clearEl(gateEl);
    gateEl.classList.add("visible");
    gateEl.appendChild(el("strong", null, "Clinical review pending"));
    for (const entry of unresolved || []) {
      gateEl.appendChild(el("div", null, `${entry.kind} — ${entry.lobe}`));
    }
    const linkWrap = el("div");
    const link = el("a", {
      href: `?case=${encodeURIComponent(caseId)}&allow_review=1`,
    }, "Open anyway (development)");
    linkWrap.appendChild(link);
    gateEl.appendChild(linkWrap);
    clearEl(stageEl);
    stageEl.appendChild(el("div", { className: "empty" }, `Case ${caseId} is blocked by unresolved review.`));
  }

  async function openCase(caseId, allowReview) {
    if (!caseId) return;
    if (currentCase !== caseId) {
      stopJobPoll();
      routeStartMoving = false;
      routeStartConfirmedNode = null;
      routeStartSelectedNode = null;
    }
    currentCase = caseId;
    gateEl.classList.remove("visible");
    clearEl(gateEl);
    await loadWorkflow(caseId);
    if (reviewPanel.classList.contains("visible")) await loadReview(caseId);
    const q = allowReview ? "?allow_review=1" : "";
    const res = await fetch(`/api/cases/${encodeURIComponent(caseId)}/payload${q}`);
    if (res.status === 409) {
      const body = await res.json();
      showGate(caseId, body.unresolved);
      history.replaceState(null, "", `?case=${encodeURIComponent(caseId)}`);
      return;
    }
    if (!res.ok) {
      clearEl(stageEl);
      stageEl.appendChild(el("div", { className: "empty" }, `Could not load case ${caseId} (${res.status}).`));
      return;
    }
    const payload = await res.json();
    if (payload.route_start) {
      routeStartConfirmedNode = payload.route_start.confirmed ? payload.route_start.node : null;
      routeStartSelectedNode = payload.route_start.node;
      const s5 = workflowBody && workflowBody.steps.find(s => s.step === 5);
      syncRouteStartButtons(s5);
    }
    history.replaceState(null, "", `?case=${encodeURIComponent(caseId)}${allowReview ? "&allow_review=1" : ""}`);
    clearEl(stageEl);
    const iframe = el("iframe", {
      title: "Renderer",
      src: `/renderer.template.html?case=${encodeURIComponent(caseId)}${allowReview ? "&allow_review=1" : ""}`,
    });
    stageEl.appendChild(iframe);
    pollJobOnce(caseId);
  }

  function renderScanTable(result) {
    const wrap = document.getElementById("import-table-wrap");
    clearEl(wrap);
    clearEl(importSeries);
    importSeries.appendChild(el("option", { value: "" }, "Proposed"));
    if (!result) return;
    const table = el("table", { className: "series-table" });
    const thead = el("thead");
    const hr = el("tr");
    for (const h of ["Folder", "No.", "Description", "Kernel", "Spacing", "Reason"]) {
      hr.appendChild(el("th", null, h));
    }
    thead.appendChild(hr);
    table.appendChild(thead);
    const tbody = el("tbody");
    for (const row of result.series) {
      const tr = el("tr", { className: row.proposed ? "proposed" : "" });
      tr.appendChild(el("td", null, row.folder));
      tr.appendChild(el("td", null, String(row.series_number)));
      tr.appendChild(el("td", null, row.description || ""));
      tr.appendChild(el("td", null, row.kernel || ""));
      tr.appendChild(el("td", null, `${row.spacing_mm} mm`));
      tr.appendChild(el("td", { className: "skip" }, row.skip_reason || (row.proposed ? "proposed" : "")));
      tbody.appendChild(tr);
      if (!row.skip_reason) {
        importSeries.appendChild(el(
          "option",
          { value: String(row.folder) },
          `${row.folder} / ${row.series_number}`,
        ));
      }
    }
    table.appendChild(tbody);
    wrap.appendChild(table);
    document.getElementById("import-confirm").disabled = false;
  }

  document.getElementById("toggle-import").onclick = () => {
    importPanel.classList.toggle("visible");
    if (importPanel.classList.contains("visible") && !document.getElementById("import-src").value) {
      document.getElementById("import-src").value = "~/Downloads/dicom";
    }
  };

  function postToRenderer(msg) {
    const iframe = stageEl.querySelector("iframe");
    if (iframe && iframe.contentWindow) {
      iframe.contentWindow.postMessage(msg, location.origin);
    }
  }

  async function loadReview(caseId) {
    if (!caseId) return;
    const res = await fetch(`/api/cases/${encodeURIComponent(caseId)}/review`);
    if (!res.ok) {
      reviewMsg.textContent = `Review load failed (${res.status})`;
      return;
    }
    reviewBody = await res.json();
    renderReview(reviewBody);
  }

  function flagKeyAttr(kind, lobe) {
    return `${kind}|${lobe}`;
  }

  function renderReview(body) {
    const bridgesEl = document.getElementById("review-bridges");
    const flagsEl = document.getElementById("review-flags");
    const corrEl = document.getElementById("review-corrections");
    clearEl(bridgesEl);
    clearEl(flagsEl);
    clearEl(corrEl);
    reviewMsg.textContent = "";
    for (const b of body.bridges || []) {
      const row = el("div", { className: "row" });
      const label = `Bridge ${b.id} · gap ${b.gap_mm} mm`;
      const state = b.decision ? b.decision.decision : "pending";
      row.appendChild(el("span", null, `${label} (${state})`));
      row.appendChild(el("button", {
        type: "button", className: "secondary", "data-bridge-goto": b.id,
      }, "Go to"));
      const note = el("input", {
        type: "text", placeholder: "CT evidence note", "data-bridge-note": b.id,
        value: (b.decision && b.decision.note) || "",
      });
      note.style.minWidth = "12rem";
      row.appendChild(note);
      row.appendChild(el("button", {
        type: "button", "data-bridge-confirm": b.id,
      }, "Confirm"));
      row.appendChild(el("button", {
        type: "button", className: "secondary", "data-bridge-reject": b.id,
      }, "Reject"));
      bridgesEl.appendChild(row);
    }
    if (!(body.bridges || []).length) {
      bridgesEl.appendChild(el("div", { className: "msg" }, "No bridges."));
    }
    for (const f of body.review_flags || []) {
      const row = el("div", { className: "row" });
      const so = f.signoff ? f.signoff.decision : "unsigned";
      const key = flagKeyAttr(f.kind, f.lobe);
      row.appendChild(el("span", null, `${f.kind} · ${f.lobe} (${so})`));
      const finding = el("input", {
        type: "text", placeholder: "Finding", "data-flag-finding": key,
      });
      row.appendChild(finding);
      row.appendChild(el("button", {
        type: "button", "data-flag-approve": key,
      }, "Approve"));
      row.appendChild(el("button", {
        type: "button", className: "secondary", "data-flag-reject": key,
      }, "Reject"));
      flagsEl.appendChild(row);
    }
    if (!(body.review_flags || []).length) {
      flagsEl.appendChild(el("div", { className: "msg" }, "No review flags."));
    }
    for (const c of body.corrections || []) {
      const row = el("div", { className: "row" });
      row.appendChild(el("span", null,
        `${c.kind} edge ${c.edge_id} · ${c.status || "active"}${c.note ? " — " + c.note : ""}`));
      if (!c.undone) {
        row.appendChild(el("button", {
          type: "button", className: "secondary", "data-undo": c.id,
        }, "Undo"));
      }
      corrEl.appendChild(row);
    }
    if (!(body.corrections || []).length) {
      corrEl.appendChild(el("div", { className: "msg" }, "No corrections."));
    }
  }

  document.getElementById("toggle-review").onclick = async () => {
    reviewPanel.classList.toggle("visible");
    if (reviewPanel.classList.contains("visible") && currentCase) {
      await loadReview(currentCase);
    }
  };

  reviewPanel.addEventListener("click", async (ev) => {
    const t = ev.target;
    if (!(t instanceof HTMLElement) || !currentCase) return;
    if (t.dataset.bridgeGoto) {
      const b = (reviewBody && reviewBody.bridges || []).find(x => x.id === t.dataset.bridgeGoto);
      if (b && b.midpoint_mm) {
        postToRenderer({
          type: "goto-ras",
          ras_mm: b.midpoint_mm,
          source: "bridge",
          airwayOverlay: true,
        });
      }
      return;
    }
    const decide = t.dataset.bridgeConfirm ? "confirmed"
      : t.dataset.bridgeReject ? "rejected" : null;
    const bid = t.dataset.bridgeConfirm || t.dataset.bridgeReject;
    if (decide && bid) {
      const noteEl = reviewPanel.querySelector(`[data-bridge-note="${CSS.escape(bid)}"]`);
      const note = noteEl ? noteEl.value : "";
      const res = await fetch(`/api/cases/${encodeURIComponent(currentCase)}/bridges/${encodeURIComponent(bid)}`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ decision: decide, note }),
      });
      const body = await res.json().catch(() => ({}));
      if (!res.ok) {
        reviewMsg.textContent = body.detail || `Bridge ${decide} failed (${res.status})`;
        return;
      }
      reviewMsg.textContent = `Bridge ${bid} ${decide}`;
      await loadReview(currentCase);
      await loadWorkflow(currentCase);
      await reloadRenderer(currentCase);
      return;
    }
    const flagKey = t.dataset.flagApprove || t.dataset.flagReject;
    if (flagKey) {
      const [kind, ...lobeParts] = flagKey.split("|");
      const lobe = lobeParts.join("|");
      const decision = t.dataset.flagApprove ? "approved" : "rejected";
      const findingEl = reviewPanel.querySelector(
        `[data-flag-finding="${CSS.escape(flagKey)}"]`
      );
      const finding = findingEl ? findingEl.value : "";
      const res = await fetch(`/api/cases/${encodeURIComponent(currentCase)}/review-signoff`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ kind, lobe, decision, finding }),
      });
      const body = await res.json().catch(() => ({}));
      if (!res.ok) {
        reviewMsg.textContent = body.detail || `Sign-off failed (${res.status})`;
        return;
      }
      await loadReview(currentCase);
      await loadWorkflow(currentCase);
      return;
    }
    if (t.dataset.undo) {
      const res = await fetch(
        `/api/cases/${encodeURIComponent(currentCase)}/corrections/${encodeURIComponent(t.dataset.undo)}`,
        { method: "DELETE" },
      );
      const body = await res.json().catch(() => ({}));
      if (!res.ok) {
        reviewMsg.textContent = body.detail || `Undo failed (${res.status})`;
        return;
      }
      await loadReview(currentCase);
      await loadWorkflow(currentCase);
      await reloadRenderer(currentCase);
    }
  });

  document.getElementById("import-scan").onclick = async () => {
    importMsg.textContent = "Scanning…";
    scanResult = null;
    const src = document.getElementById("import-src").value.trim();
    const res = await fetch("/api/imports/scan", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ src_dir: src }),
    });
    const body = await res.json().catch(() => ({}));
    if (!res.ok) {
      importMsg.textContent = body.detail || `Scan failed (${res.status})`;
      document.getElementById("import-confirm").disabled = true;
      return;
    }
    scanResult = body;
    importMsg.textContent = `Proposed: ${body.proposed.folder} / SeriesNumber ${body.proposed.series_number}`;
    renderScanTable(body);
  };

  document.getElementById("import-confirm").onclick = async () => {
    const src = document.getElementById("import-src").value.trim();
    const series = importSeries.value || (scanResult && scanResult.proposed.folder);
    importMsg.textContent = "Importing…";
    const res = await fetch("/api/imports", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ src_dir: src, series, confirm: true }),
    });
    const body = await res.json().catch(() => ({}));
    if (res.status === 409) {
      importMsg.textContent = body.detail || "Duplicate series";
      return;
    }
    if (!res.ok) {
      importMsg.textContent = body.detail || `Import failed (${res.status})`;
      return;
    }
    importMsg.textContent = `Imported ${body.case_id}`;
    await loadCases();
    selectEl.value = body.case_id;
    openCase(body.case_id, false);
  };

  document.getElementById("confirm-existing-series").onclick = async () => {
    if (!currentCase) return;
    importMsg.textContent = "Confirming series…";
    const res = await fetch(`/api/cases/${encodeURIComponent(currentCase)}/series/confirm`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ overridden: false }),
    });
    const body = await res.json().catch(() => ({}));
    if (!res.ok) {
      importMsg.textContent = body.detail || `Confirm failed (${res.status})`;
      return;
    }
    importMsg.textContent = `Series confirmed for ${currentCase}`;
    await loadWorkflow(currentCase);
  };

  async function reloadRenderer(caseId) {
    if (!caseId || currentCase !== caseId) return;
    const allow = new URLSearchParams(location.search).get("allow_review") === "1";
    await openCase(caseId, allow);
  }

  async function pollJobOnce(caseId) {
    if (!caseId || (currentCase && caseId !== currentCase)) return;
    const res = await fetch(`/api/cases/${encodeURIComponent(caseId)}/jobs/latest`);
    if (!res.ok) return;
    const job = await res.json();
    if (job.status === "none") {
      jobPanel.classList.remove("visible");
      return;
    }
    jobPanel.classList.add("visible");
    jobStatus.textContent = `Job: ${job.status}`;
    jobElapsed.textContent = `elapsed ${job.elapsed_s}s · ${job.kind || "segment"}`;
    jobLog.textContent = (job.log_tail || []).join("\n");
    if (job.status === "running" || job.status === "queued") {
      if (!jobPoll || jobPollCase !== caseId) {
        stopJobPoll();
        jobPollCase = caseId;
        jobPoll = setInterval(() => pollJobOnce(caseId), 1000);
      }
    } else {
      stopJobPoll();
      await loadWorkflow(caseId);
      if (job.status === "succeeded") {
        await reloadRenderer(caseId);
      }
    }
  }

  segmentBtn.onclick = async () => {
    if (!currentCase) return;
    const s3 = workflowBody && workflowBody.steps.find(s => s.step === 3);
    if (s3 && s3.status === "done") {
      const ok = window.confirm(
        "Re-run segmentation? Downstream steps (review, RouteStart, target, walk, sign-off) will be invalidated until re-confirmed."
      );
      if (!ok) return;
    }
    jobStatus.textContent = "Starting…";
    const res = await fetch(`/api/cases/${encodeURIComponent(currentCase)}/segment`, {
      method: "POST",
    });
    const body = await res.json().catch(() => ({}));
    if (!res.ok) {
      jobStatus.textContent = body.detail || `Segment failed (${res.status})`;
      return;
    }
    jobPanel.classList.add("visible");
    stopJobPoll();
    jobPollCase = currentCase;
    jobPoll = setInterval(() => pollJobOnce(currentCase), 1000);
    pollJobOnce(currentCase);
  };

  routeStartBtn.onclick = async () => {
    if (!currentCase) return;
    const candRes = await fetch(`/api/cases/${encodeURIComponent(currentCase)}/route-start/candidates`);
    if (!candRes.ok) {
      alert(`Candidates failed (${candRes.status})`);
      return;
    }
    const cand = await candRes.json();
    const node = routeStartSelectedNode != null
      ? routeStartSelectedNode
      : (cand.candidates.find(c => c.is_default) || cand.candidates[0] || {}).node;
    if (node == null) {
      alert("No qualifying RouteStart terminal");
      return;
    }
    const res = await fetch(`/api/cases/${encodeURIComponent(currentCase)}/route-start`, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ node: Number(node) }),
    });
    const body = await res.json().catch(() => ({}));
    if (!res.ok) {
      alert(body.detail || `RouteStart failed (${res.status})`);
      return;
    }
    routeStartMoving = false;
    routeStartConfirmedNode = body.route_start.node;
    routeStartSelectedNode = body.route_start.node;
    await loadWorkflow(currentCase);
    openCase(currentCase, new URLSearchParams(location.search).get("allow_review") === "1");
  };

  document.getElementById("move-route-start-btn").onclick = () => {
    routeStartMoving = true;
    const s5 = workflowBody && workflowBody.steps.find(s => s.step === 5);
    syncRouteStartButtons(s5);
    alert("Pick another qualifying terminal in the CT panes, then confirm.");
  };

  document.getElementById("open-case").onclick = () =>
    openCase(selectEl.value, false);

  (async () => {
    const clinician = await fetch("/api/clinician").then(r => r.json());
    renderClinician(clinician);
    await loadCases();
  })();
  </script>
</body>
</html>
