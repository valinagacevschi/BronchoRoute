apiVersion: v1
kind: PersistentVolume
metadata:
  name: lung-nav-data
  labels:
    app: lung-nav
spec:
  # Create /volumes/lung-nav-data on node k8s (see deploy/README.md); chown 10001:10001.
  capacity:
    storage: 2Gi
  accessModes:
    - ReadOnlyMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  claimRef:
    namespace: lung-nav
    name: lung-nav-data
  hostPath:
    path: /volumes/lung-nav-data
    type: Directory
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - k8s
